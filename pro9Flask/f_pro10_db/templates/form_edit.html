<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>상품 수정</h3>
    {% if messages %} <!--flash 메세지 관련 출력-->
    <ul>
        {% for m in messages %} <!--messages의 담긴 여러 메세지를 for 반복으로 출력-->
        <li>{{m}}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form action="{{url_for('edit_save',code=row.code)}}" method="post">
        <p> 상품코드: <b>{{row.code}} (pk는 수정에서 제외)</b> </p>
        <p> 품명: <input name="sang" value="{{row.sang}}"></p>
        <p> 수량: <input name="su" value="{{row.su}}"></p>
        <p> 단가: <input name="dan" value="{{row.dan}}"></p>
        <button type="submit">수정</button>
        <a href="{{url_for('show_list')}}">수정 취소</a>
    </form>

</body>
</html>
