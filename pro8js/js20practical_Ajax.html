<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- axiois cdn-->
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h3>실무적인 AJAX 처리방법 3가지</h3>
    <button id="btn1"1>fetch then</button>
    <button id="btn2"2>async fetch</button>
    <button id="btn3"3>axios library</button>
    <hr><hr>
    <div id="result"></div>

    <script>
        document.querySelector("#btn1").onclick=funFetch;
        document.querySelector("#btn2").onclick=funAsync;
        document.querySelector("#btn3").onclick=funAxios;

        //1. fetch+then 방식
        function funFetch(){
            fetch("sangpum.json") // 상품 json을 요청하면
            .then(response => { //반환해줌. response 말고 아무 단어 사용 가능
                if(!response.ok){ // 반환값 수신 성공이 아닌경우
                    throw new Error("서버오류");
                }
                return response.json(); // 반환값 수신 성공인 경우 json을 반환
            })
            .then(data=>{ //resptonse.json()의 결과를 data에 넘김
                
                let output="<b>fetch+then 결과</b><br>"
                data.forEach(item => {
                    output +="코드: " + item.code + ", 품명: "+ item.sang+"<br>";
                });
                document.getElementById("result").innerHTML=output;
            })
            .catch(err=>{
                document.getElementById("result").innerHTML="에러 조졌;;"+err;
            });
        }

        //2. asycn + await fetch 방식
        async function funAsync(){
            try{
                const response = await fetch("sangpum.json");
                if(!response.ok){
                    throw new Error("async 서버 오류");
                }

                const data =await response.json();
                
                let output="<b>async+then 결과</b><br>"

                data.forEach(item => {
                    output +="코드: " + item.code + ", 품명: "+ item.sang+"<br>";
                });
                document.getElementById("result").innerHTML=output;
            }
             catch(error){
            document.getElementById("result").innerHTML="에러발생: "+error;
        }
           
        }

        //3. axios 방식 //이 방식 쓰려면 8번줄처럼 라이브러리를 하나 꽂아줘야함. 대신 json 변화 안해도 됨
        async function funAxios(){
            try{
                const response = await axios.get("sangpum.json"); //fetch 대신 axios.get
                const data =response.data //Json 처리를 해줌. 우리가 따로 할 필요 없음 
                
                let output="<b>Axios+then 결과</b><br>"

                data.forEach(item => {
                    output +="코드: " + item.code + ", 품명: "+ item.sang+"<br>";
                });
                document.getElementById("result").innerHTML=output;

            }catch(error){
            document.getElementById("result").innerHTML="Axios 에러발생: "+error;
        }
    }
    </script>
</body>
</html>
