<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <i>Array(배열): 순서가 있는 여러개의 자료를 대표명을 주고 첨잘 각 기억장소를 구분하는 자료구조<br>
    파이썬에서는 순수 배열이 아니라 튜플 셋 리스트 형태(메모리를 많이 잡아먹음)의 배열을 사용했고
    <br>나중에는 numpy배열을 쓴다<br>
    반복처리에 효과적이다<br>
    형식: 배열명 = new Array(): </i><br>
<hr>
    <script>
        let aa=new Array(); // 배열객체 생성. 배열 선언. 크기는 가변적.
        // new Array(3)처럼 선언과 동시에 배열의 크기를 지정할 수 있지만 권장하지 않음
        aa[0]=10; aa[1]=5.6; aa[3]="정수, 실수, 문자열도 넣을 수 있음"; aa[4]="안녕";
        aa[5]=true; aa[6]={kbs:9,sbs:5};//키밸류형식
        //배열 요소값 type은 마음대로. json type({key:value})도 가능
        document.write('배열 크기: ',aa.length,"<br>");
        document.write('배열 type: ',typeof(aa).length,"<br>");
        document.write('배열 type: ',typeof(aa),"<br>");
        let su=0,num=0
        document.write(`${aa[0]} ${aa[1]} ${aa[su]} ${aa[num]}`,"<br>");
        // aa[0]과 aa[su,num] 다 같은 값이다. []안에 그저 0이 들어가서 그럼.
        // 첨자(index)는 상수 또는 변수도 가능하다.
        document.write("<br><br><br>");

        let bb = new Array(100,200,300) //시작과 동시에 초기치 부여
        document.write(`${bb[0]} ${bb[1]} ${bb[2]}`,"<br>");
        document.write("<br><br>");

        let cc=[]; //비어 있는 배열 선언. 배열 리터럴
        cc[0] = "oscar"
        document.write(`${cc[0]}`,"<br>");
        cc.push("seoul"); // push 메소드를 사용해서 배열에 값을 저장
        cc.push(2026,9,18); //여러 값도 가능. 계속 추가된 것이기 때문에 0 1 2 3 4 의 배열이 생성
        document.write(`${cc[0]} ${cc[1]} ${cc[2]} ${cc[3]} ${cc[4]} ${cc[5]}`,"<br>");
        cc[99] ="wow";
        document.write(`cc배열의 크기는 ${cc.length}`,"<br>");

        document.write("<hr><hr>");
        let dd=new Array(); // 배열 선언 후 for를 이용해 자료 입출력
        for(let m=0; m<10; m++)
        {
            dd[m]=m+1;
        }
        document.write("dd의[0]: ",dd[0],"<br>") //계속 이렇게 출력하면 불편
        for(let m=0; m<10; m++)//{}안에서 let으로 같은 변수 이름은 사용 불가능. 하지만 지역변수라서 외부에서는 같은 이름 사용 가능
        {
            document.write(dd[m] + "&nbsp;&nbsp;&nbsp;");//일반 사용자가 보는 브라우저에 출력
            console.log(dd[m]); // 개발자가 개발 도중에 값 참조시 사용
        }
        document.write("<br><br>")

        let myarr=[
            "안녕",
            true,
            2.3,
            {name:"기타"},
            function(){
                document.write('이거는 함수');
            }
        ];
        document.write("myarr[0]: ",myarr[0],"<br>");
        document.write("myarr[3].name: ",myarr[3].name,"<br>");
        document.write("myarr[4](): ",myarr[4](),"<br>");
        document.write("<br><br>")

       
        document.write("<hr><hr>");
        let korea = ["가을", "미세먼지없음", "쾌청"];

        // 1번 방법 (&lt; 로 수정)
        document.write("1번방법 [(let i=0; i &lt; korea.length; i++)] 으로 for 배열 출력: ");
        for (let i = 0; i < korea.length; i++) {
            document.write(korea[i] + "&nbsp;&nbsp;");
        }
        document.write("<br><br>");

        // 2번 방법
        document.write("2번방법 [(let i of korea)] 으로 for 배열 출력: ");
        for (let i of korea) {
            document.write(i + "&nbsp;&nbsp;");
        }
        document.write("<br><br>");

        // 3번 방법
        document.write("3번방법 [(let i in korea)] 으로 for 배열 출력: ");
        for (let i in korea) {
            document.write(korea[i] + "&nbsp;&nbsp;");
        }
        document.write("<br><br>");


        document.write("<hr><hr>");
        document.write("dlete로 지우기");
        //배열 요소 제거 delete,splice
        let ar =['i', 'go', 'home'];
        delete ar[1] //go삭제. 자리는 남아있다
        document.write(ar," ",ar.length)


        document.write("<hr><hr>");
        document.write("splice로 지우기");
        //배열 요소 제거 delete,splice
        let kr =['i', 'go', 'home'];
        kr.splice (1,1) //인덱스 1부터 1개 삭제. 자리도 지워버림
        document.write(kr," ",kr.length)

        document.write("<hr><hr>");
        document.write("구조분해할당<br>");
        // 구조 분해 할당: 배열, 객체의 값들을 추출하여 한번에 여러 변수에 할당
        let nums =[1,2,3,4];
        let [a1,a2,a3,a4]=nums;
        document.write(`${a1} ${a2} ${a3} ${a4}`,"<br><br>")
        let [b1,,,b4]=nums;
        document.write(`${b1}  ${b4}`,"<br><br>") //필요없는 값은 건너뛰기

        let human={name: "홍길동", age:27} // 키:밸류 형식인 json 타입
        let {name,age}=human;
        document.write(`${name} ${age}`)


        document.write("<hr><hr>");
        document.write("전개연산자 ... <br>");
        // 배열이나 ㄱㄱ체의 요소를 펼쳐서 복사하거나 결합할 떄 사용
        let fruits=["apple", "peach", "melon"];
        let imsi = [...fruits]; // 배열 요소를 펼쳐 새로운 배열에 저장
        // 사용방법: ... 원본 배열 이름
        document.write("imsi 배열에새로 저장된 값 출력: " ,imsi," ",imsi.length,"<br>");
        document.write("주소 치환 x fruits랑 === imsi비교: " ,fruits===imsi,"<br>"); // 이건 거짓
        let fr=fruits; //주소를 치환하여 같은 값으로 만듬
        document.write("주소 치환 o fruits랑 === fr비교: " ,fruits===fr,"<br>");

        document.write("<br>");
        const a=["apple", "peach"];
        const b=["banana", "melon"];
        const c=[...a, ...b] // 두배열을 합치는 것도 가능
        document.write("a배열 출력: ", a,"<br>");
        document.write("b배열 출력: ", b,"<br>");
        document.write("a,b배열 합친 c 배열 출력: ", c,"<br>");
        document.write("구분자를 공백으로 두어 join메서드로 문자열 합치기: ",c.join(" ")); //구분자를 공백으로 두어 join메서드로 문자열 합치기
        </script> 
</body>
</html>
