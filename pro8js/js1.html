<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    **<b>자바스크립트</b> : Client side script **<br>
    <script>
    window.document.write("환영합니다. JS 세상") // 한줄 주석. 브라우저 화면으로 출력하기
    document.write("<h2>브라우저에 문자열 출력</h2>");
    console.log("개발자를 위해 표준 출력 장치로 출력 - 기본 화면에는 보이지 않음")
    </script>

    <br>다시 HTML로 작성<br>

    이 아래는 자바스크립트<br>
    <script>
        document.write("<b>b 사용해서 굵은 문자열 출력</b><br>"); //여기다 <br>쓰면 스크립트 단이라서 안됨
        document.write("<i>i 사용해서 기울인 문자열 출력</i><br>");
        document.write("<a href ='https://www.google.com'>구글로 이동</a><br>");
    </script>

    또 다시 HTML<br>

    <script>
        document.write("여기는 자바스크립트");
        let a =10;
        let b=a +10;
        document.write("<br> b는 ", b);
    </script>
    <br>

    <br>자바스크립트 변수값을 html 태그에 출력 -> 이 문장은 html에서 작성<br>
    <i>b의 값은? <span id="result"></span>입니다</i>

   <script>
    document.getElementById("result").textContent=b;
    </script>


</body>
</html>
