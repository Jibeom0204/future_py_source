    <h2><i>*조건 판단문*</i></h2>>
    <script>
        //let ave = prompt("평군 점수 입력: ", "10");
        //document.write("ave", ave);

        let ave = 85;
        if(ave >= 90) // 파이썬과 다르게 if 닫을 때 : 안 적어도 됨
            document.write("점수 : "+ ave +"이므로 <b style='color:blue'>우수</b>");
        else if(ave >= 70) //C와 같이 else if. 들여쓰기 안해도 됨
        document.write("점수 : "+ ave +"이므로 <b style='color:red'>보통</b>");
        else
        document.write("점수 : "+ ave +"이므로 <b style='color:cyne'>저조</b>");
    </script>
