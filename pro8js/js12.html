        }

        function func2(){

            console.log(str2);
            document.querySelector("#show2").innerHTML=str2;
            document.querySelector("#show3").innerText=str2;
        }
    </script>

</head>
<body>
<pre>
DOM:실행 중 tag의 생성,수정,삭제 또는 데이터 참조,추가,수정,삭제 처리 가능
element.innerText : element 안의 text 값들만 대상으로 처리
element.innerHTML : element 안의 text 뿐만 아니라 HTML이나 XML을 대상으로 처리
