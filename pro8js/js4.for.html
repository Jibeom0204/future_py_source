<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h2><i>*반복문 for(초기값; 조건; 증가값)*</i></h2>>
    <script>
        for(let a=1; a<=5; a=a+1)
        //for(let a=1; a<=5; ++a) for(let a=1; a<=5; a++) 1씩 증가할 때는 이렇게 가능
        {
            document.write("a값은"+ a +"<br>");
            //파이썬에서는 이러면 타입 안맞아서 오류나는데
            //자바스크립트에서는 그냥 문자열로 더함
        }
        //document.write("for 블럭 수행후 밖에서 출력하는 a값:" +a +"<br>");

        let k=1
        for(k=1; k<=5; k=k+1)
        //for(let a=1; a<=5; ++a) for(let a=1; a<=5; a++) 1씩 증가할 때는 이렇게 가능
        {
            document.write("k값은"+ k +"<br>");
            //파이썬에서는 이러면 타입 안맞아서 오류나는데
            //자바스크립트에서는 그냥 문자열로 더함
        }
        document.write("for 블럭 수행후 밖에서 출력하는 k값:" +k +"<br>");
        
        // 2더하기
        document.write("<br><br>")
        for(let a=3; a<=11; a+=2)
        {
            document.write("a+=2의 a값은"+ a +"<br>");
        }

        // 빼기
        document.write("<br><br>")
        for(let a=5; a>=1; a--)
        {
            document.write("a--의 a값은"+ a +"<br>");
        }


        // 다중 for
        document.write("<br>다중for<br>")
        for(let i=1; i<=3; i++)
        {
            document.write("1차 for i값은"+ i +"<br>"); //1. 1번 수행 후 내부 for이동. 총 수행 횟수는 3회
            for(let j =1; j<=4; j++)
            document.write("2차 for의 j값은"+ j +"&nbsp&nbsp&nbsp"); // 2. 1차 for가 한번 수행후 이거 4번 반복. 다 수행하면 탈출해서 새로운 조건을 만남.
        }document.write("<br><br>")

        
        document.write("<br>1~10까지 정수의 합<br>")
        let sum=0;
        for(let su=1; su<=10; su++)
        {
            sum=sum+su;
        }document.write(sum,"<br>");
        
        //
        document.write("<br>1~100까지 정수 중 2의 배수이나 5의 배수가 아닌 수의 합<br>")
        //! 참고
        // ==: 느슨한 동등 비교로 타입을 자동변환한 후에 값만 비교
        // ===: 엄격한 일치 비교로 데이터 타입이 모두 같아야 true를 반환함.//js에만 있음
        //document.write(10=="10","<br>"); //true //"문자 10"을 숫자10으로 자동 변환 후 비교
        //document.write(10=="100","<br>"); //false //type까지 비교 //js에서 if 사용할 때 권장 
        let tot=0;
        for(let i=1; i<=100; i++)
        {
            if(i%2===0 && i%5!==0){
                tot+=i;
            }
        }document.write(tot,"<br>");


    document.write("<hr>2~9 구구단 출력 <hr>")
    document.write("<table class='table table-bordered table-striped table-haver'>");
    for(let a=2; a<10;a++)
    {
        document.write("<tr>")
        for(let b=1;b<9;b++)
        {
        //   document.write("<td>")
        //     document.write(a+"*"+b+"="+a*b)
        //   document.write("</td>")  
        document.write(`<td> ${a} * ${b} = ${a*b}&nbsp;&nbsp;</td>`); // 템플릿 문자열
        }
        document.write("</tr>")
    }

        document.write("</table>");


        
    </script>
</body>
</html>
