    <title>Document</title>

    <script type="text/javascript">
        function bb()
        {
        document.write("이거는 bb함수;<br><br>")
        cc(10) // bb에서 cc호출. 함수가 다른 함수 호출 가능. 반환 값 무시
        //cc(1,2,3); //파라미터 개수가 일치하지 않아도 수행됨. 맞는 개수만 받아먹고 나머지는 버림
        let re =cc(5); // 반환값 처리
        document.write("bb에서 re 호출", `${re}`,"<br>");

        dd("dd에 인자 값2개를 넣어줌",7,8,"br");
        dd("dd에 인자 값3개를 넣어줌",7,8,9,"br");
        dd("dd에 인자 값1개를 넣어줌",7,"br");
        dd("dd에 인자 안 넣어줌","br");
        }

        function cc(para)
        {
        let kk=para+10;
        document.write("cc함수에서 kk 호출", `${kk}`,"<br><br>");
        return kk;
        }

        function dd(para1, para2)
        {
        document.write("dd함수에 호출", `${para1} ${para2}`,"<br><br>");
        }

        // 전역, 지역변수
        let a =100; //전역변수
        const b =200; //전역상수
        function  func()
        {
            let c =300; // 함수내 지역 변수
            const d =400; // 함수내 지역 상수
            document.write(`a:${a} b:${b}`,"<br>");
            document.write(`c:${c} d:${d}`,"<br>"); 

        }
        
    </script>

</head>
<body>

    <pre ><i>필요할 때 호출하여 반복처리, 자원의 재활용성을 높임

    </i></pre>

    <script>
    document.write("사용자 정의 함수<br><br>");
    let count =0;
    function aa() //함수의 선언
    {
        count +=1;
         document.write(count + "번 수행 <br>");
    }
     document.write("aa()함수를 호출<br>");
     aa();
     document.write("뭔가를 하다가..<br>");
     aa();
     document.write("한번 더 실행. 함수는 참조형 타입<br>", typeof(aa));
    </script>
