<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //주문 객체
        //Literal 방식
        const order={
            orderNO:"a1001",
            customer:{
                name:"고릴라",tel:"010-7549-9445"
            },
            products:[
                {name: "노트북", price:2345000,qty:1},
                {name: "말랑이", price:5000,qty:3},
                {name: "컵라면", price:3000,qty:5}
            ],

            // 총 주문 금액을 계산
            getTotal:function(){
                let total=0;
                this.products.forEach(pro => {
                    total += pro.price*pro.qty;
                });
                return total;
            }
        }; // order 객체 생성 끝

        function showOrder(){
            let str ="";
            str +=`<h3>주문번호: ${order.orderNO}</h3>`;
            str +=`고객명: ${order.customer.name}<br>`;
            str +=`고객전화: ${order.customer.tel}<br>`;
            str +="<b>삼품목록</b>";
            order.products.forEach(products =>{
                str +=`상품명: ${products.name}<br>`;
                str +=`가격: ${products.price}<br>`;
                str +=`수량: ${products.qty}<br>`;
                str +=`금액: ${(products.price*products.qty).toLocaleString()}원<br>`;
            });


        str +=`
        <h3>총 주문 금액: ${order.getTotal()}원</h3>
        `;

        document.querySelector("#result").innerHTML=str;
            
        }
    </script>
</head>

<body>
    <h3>객체를 만드는 가장큰 이유는 서로 관련있는 여러데이터와 기능을 하ㅏㄴ로 묶어서 관리하기 위함</h3>
    <h2>쇼핑몰 주문 정보</h2>
    <button onclick="showOrder()">주문정보보기</button>
    <br>
    <div id="result"></div>
</body>
</html>
