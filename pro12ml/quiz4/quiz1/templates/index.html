<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>근무년수별 예상 연봉</title>
<style>
  body { font-family: sans-serif; margin: 20px; max-width: 600px; }
  input { padding: 8px; width: 200px; }
  button { padding: 8px 12px; }
  #result { background: #f5f5f5; padding: 12px 14px; margin-top: 16px; line-height: 1.6; }
  #result:empty { display: none; }
  .error { color: red; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
</style>
</head>
<body>
  <h2>근무년수 → 예상 연봉(LinearRegression)</h2>

  근무년수 : <input type="text" id="year">
  <button id="sendBtn">확인</button>
  <div id="result"></div>

  <h3>직급별 연봉평균</h3>
  <table>
    <tr><th>직급</th><th>평균 연봉</th></tr>
    {% for row in jik_list %}
    <tr><td>{{ row.jik }}</td><td>{{ row.pay }}</td></tr>
    {% endfor %}
  </table>

<script>
  const $ = (sel) => document.querySelector(sel);

  $('#sendBtn').addEventListener('click', async () => {
    const year = $('#year').value.trim();

    const params = new URLSearchParams({ year });
    const url = `/api/predict?${params.toString()}`;

    try {
      const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
      const data = await res.json();

      if (!res.ok || data.ok === false) {
        $('#result').innerHTML = `<span class="error">에러 : ${data.error}</span>`;
        return;
      }
      $('#result').innerHTML = `
        <div>예상연봉액 : <b>${data.pay}</b></div>
        <div>설명력(R²) : <b>${data.r2}</b></div>
        <div>회귀식 : ${data.formula}</div>`;
    } catch (err) {
      $('#result').innerHTML = `<span class="error">${err}</span>`;
    }
  });
</script>
</body>
</html>
